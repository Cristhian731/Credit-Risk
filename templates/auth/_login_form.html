<!--
  LOGIN FORM CONTRACT (teammate B)
  - Submits with method="POST" to url_for('auth.login') (app/auth/routes.py).
  - Field names: email (type="email"), password (type="password"),
    remember (checkbox, sent as "on" only when ticked).
  - "Create an account" links to url_for('auth.register').
  - Read these fields in auth.login and pass them to
    services.authenticate_user(email, password, remember).
  - Do not change the design, ids or field names of this card; only add
    server-side behavior (and, if needed, error messages via flash).
-->
<div class="card p-4 text-dark" id="login">
  <h2 class="h4 fw-bold mb-1">Log in</h2>
  <p class="text-muted small mb-3">Access the platform to evaluate loan applications.</p>

  <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <div class="mb-3">
      <label for="login-email" class="form-label">Email</label>
      <input type="email" class="form-control" id="login-email" name="email"
             autocomplete="email" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
      <label for="login-password" class="form-label">Password</label>
      <input type="password" class="form-control" id="login-password" name="password"
             autocomplete="current-password" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="login-remember" name="remember">
      <label class="form-check-label" for="login-remember">Remember me</label>
    </div>
    <button type="submit" class="btn btn-primary w-100 fw-semibold">Log in</button>
  </form>

  <p class="text-center small mt-3 mb-0">
    <a href="{{ url_for('auth.register') }}">Create an account</a>
  </p>
</div>
