{% extends "base.html" %}

{% block title %}Create Account | Credit Risk{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow p-4 text-dark">
          <h1 class="h3 fw-bold mb-3">Create an account</h1>
          <p class="text-muted">Register to access the Credit Risk platform.</p>

          <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
              <label for="register-username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="register-username"
                name="username"
                autocomplete="username"
                required
              >
            </div>

            <div class="mb-3">
              <label for="register-email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="register-email"
                name="email"
                autocomplete="email"
                required
              >
            </div>

            <div class="mb-3">
              <label for="register-password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="register-password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
              >
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold">
              Create account
            </button>
          </form>

          <p class="text-center small mt-3 mb-0">
            Already have an account?
            <a href="{{ url_for('main.index', _anchor='login') }}">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
