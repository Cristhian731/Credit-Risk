{% extends "base.html" %}

{% block title %}New transaction &middot; Credit Risk{% endblock %}

{% block content %}
  <section class="card">
    <h1>New transaction</h1>
    <p class="muted">Saving will be enabled once the database models are ready.</p>

    <form class="form">
      <fieldset disabled>
        <label>Type
          <select name="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </label>
        <label>Amount <input type="number" name="amount" min="0" step="0.01"></label>
        <label>Date <input type="date" name="date"></label>
        <label>Category <input type="text" name="category"></label>
        <label>Description <input type="text" name="description"></label>
        <button type="submit">Save</button>
      </fieldset>
    </form>
  </section>
{% endblock %}
